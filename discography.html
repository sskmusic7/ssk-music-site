<!DOCTYPE html>
<html lang="en">
<head>
    <title>SSK MUSIC | Discography & Production Credits</title>
    <meta charset="UTF-8">
    <meta name="description" content="Complete discography and production credits for SSK Music. Including beats, albums, and production credits for artists like B Young, Alicai Harley, and more.">
    <meta name="keywords" content="SSK Music discography, production credits, beats, albums, B Young, Alicai Harley, Afro-swing">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" href="favicon.ico">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css"/>
    <link rel="stylesheet" href="assets/css/plugins.css"/>
    <link rel="stylesheet" href="assets/css/main.css"/>

    <!-- Premium Google Fonts - Syne for headings, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

    <!-- Font icons -->
    <link rel="stylesheet" href="assets/icon-fonts/fontawesome/css/all.min.css"/>
    <link rel="stylesheet" href="assets/icon-fonts/remixicon/remixicon.css"/>

    <!-- Discography specific styles -->
    <link rel="stylesheet" href="assets/css/discography.css"/>

    <style>
        /* SSK Music Custom Styles */
        :root {
            --ssk-navy: #1a365d;
            --ssk-navy-light: #2d4a7f;
            --ssk-dark: #0a1628;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
            letter-spacing: -0.01em;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Syne', sans-serif !important;
            text-transform: uppercase !important;
            letter-spacing: 0.02em;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        /* Sticky Navigation Header */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(26, 54, 93, 0.98);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .sticky-header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .sticky-logo a {
            color: white;
            text-decoration: none;
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .sticky-nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .sticky-nav-link {
            color: white;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: opacity 0.3s;
        }

        .sticky-nav-link:hover {
            opacity: 0.7;
        }

        /* Add padding to body to account for fixed header */
        body {
            padding-top: 80px;
            margin: 0;
        }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(135deg, #0a1628 0%, #1a365d 100%);
            padding: 6rem 2rem 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('assets/images/pattern.jpg') repeat;
            opacity: 0.05;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-title {
            color: white;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .hero-subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 1.25rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .sticky-nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Sticky Header -->
    <header class="sticky-header">
        <div class="sticky-header-content">
            <div class="sticky-logo">
                <a href="index.html">SSK MUSIC</a>
            </div>
            <nav class="sticky-nav">
                <a href="index.html" class="sticky-nav-link">Home</a>
                <a href="contact.html" class="sticky-nav-link">Contact</a>
                <a href="discography.html" class="sticky-nav-link active">Discography</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Discography</h1>
            <p class="hero-subtitle">Complete collection of beats, albums, and production credits</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="discography-page container">
        <!-- Tab Navigation -->
        <div class="discography-tabs">
            <button class="tab-btn active" data-tab="releases">
                <i class="ri-disc-line"></i>
                Releases
            </button>
            <button class="tab-btn" data-tab="credits">
                <i class="ri-music-2-line"></i>
                Production Credits
            </button>
        </div>

        <!-- Search & Filter -->
        <div class="discography-filters">
            <div class="search-box">
                <div style="display: flex; align-items: center;">
                    <i class="ri-search-line search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search releases or credits...">
                </div>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="beats">Beats</button>
                <button class="filter-btn" data-filter="albums">Albums</button>
                <button class="filter-btn" data-filter="credits">Credits</button>
            </div>
        </div>

        <!-- Releases Section -->
        <div id="releases-section">
            <div class="section-header">
                <h3>Releases</h3>
                <p class="section-subtitle">Beats and albums produced and released by SSK Music</p>
            </div>
            <div id="releasesLoading" class="loading-state">
                <i class="ri-loader-4-line"></i>
                <p>Loading releases...</p>
            </div>
            <div id="releases-content" class="releases-grid"></div>
        </div>

        <!-- Credits Section -->
        <div id="credits-section" style="display: none;">
            <div class="section-header">
                <h3>Production Credits</h3>
                <p class="section-subtitle">A-List and B-List production credits across the industry</p>
            </div>
            <div id="creditsLoading" class="loading-state">
                <i class="ri-loader-4-line"></i>
                <p>Loading credits...</p>
            </div>
            <div id="credits-content" class="credits-grid"></div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="assets/js/jquery-3.6.0.min.js"></script>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/barba.min.js"></script>
    <script src="assets/js/barba.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/discography.js"></script>
</body>
</html>
