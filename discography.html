<!DOCTYPE html>
<html lang="en">
<head>
    <title>SSK MUSIC | Discography & Production Credits</title>
    <meta charset="UTF-8">
    <meta name="description" content="Complete discography and production credits for SSK Music. Including beats, albums, and production credits for artists like B Young, Alicai Harley, and more.">
    <meta name="keywords" content="SSK Music discography, production credits, beats, albums, B Young, Alicai Harley, Afro-swing">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" href="favicon.ico">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css?v=5d92f54"/>
    <link rel="stylesheet" href="assets/css/plugins.css?v=5d92f54"/>
    <link rel="stylesheet" href="assets/css/main.css?v=5d92f54"/>

    <!-- Premium Google Fonts - Syne for headings, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

    <!-- Font icons -->
    <link rel="stylesheet" href="assets/icon-fonts/fontawesome/css/all.min.css?v=5d92f54"/>
    <link rel="stylesheet" href="assets/icon-fonts/remixicon/remixicon.css?v=5d92f54"/>

    <!-- Discography specific styles -->
    <link rel="stylesheet" href="assets/css/discography.css?v=5d92f54"/>
    <link rel="stylesheet" href="assets/css/library.css?v=5d92f54"/>

    <style>
        /* SSK Music Custom Styles */

        /* index.html sets these globally; without them the header padding
           added to its width and pushed the last nav link off-screen. */
        * {
            max-width: 100%;
            box-sizing: border-box;
        }

        html, body { overflow-x: hidden; }

        :root {
            --ssk-navy: #1a365d;
            --ssk-navy-light: #2d4a7f;
            --ssk-dark: #0a1628;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
            letter-spacing: -0.01em;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Syne', sans-serif !important;
            text-transform: uppercase !important;
            letter-spacing: 0.02em;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        /* Sticky Navigation Header */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(26, 54, 93, 0.98);
            backdrop-filter: blur(10px);
            z-index: 9999;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            visibility: visible !important;
            pointer-events: auto !important;
        }

        .sticky-header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .sticky-logo a {
            color: white;
            text-decoration: none;
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .sticky-nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .sticky-nav-link {
            color: white;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: opacity 0.3s;
            pointer-events: auto !important;
            position: relative !important;
            z-index: 1;
        }

        .sticky-nav-link:hover {
            opacity: 0.7;
        }

        /* Add padding to body to account for fixed header */
        body {
            padding-top: 80px;
            margin: 0;
        }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(135deg, #0a1628 0%, #1a365d 100%);
            padding: 6rem 2rem 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('assets/images/pattern.jpg') repeat;
            opacity: 0.05;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Match the homepage type scale exactly.
           This was 800 weight at a fixed 3.5rem while every heading on
           index.html is 700 at a responsive size — which is what made the
           discography hero read as a different font. */
        .hero-title {
            color: white;
            font-size: clamp(2.5rem, 7vw, 3.6rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
            line-height: 1.15;
        }

        .hero-subtitle {
            color: rgba(255,255,255,0.75);
            font-size: clamp(0.95rem, 1.6vw, 1.15rem);
            margin-bottom: 0;
            max-width: 620px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }


        /* ---- Sticky header: shared with index.html so the pages match ---- */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(26, 54, 93, 0.98);
            backdrop-filter: blur(10px);
            z-index: 999999 !important;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            visibility: visible !important;
            pointer-events: auto !important;
        }

        /* Ensure no elements cover the navigation */
        .sticky-header * {
            pointer-events: auto !important;
        }

        .sticky-header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .sticky-logo img {
            max-height: 40px;
            display: block;
        }

        .sticky-stats {
            display: flex;
            gap: 1.5rem;
            flex: 1;
            justify-content: center;
            overflow: hidden;
        }

        .sticky-stat {
            text-align: center;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sticky-stat-icon {
            font-size: 1rem;
        }

        .sticky-stat-icon.youtube {
            color: #FF0000;
        }

        .sticky-stat-icon.spotify {
            color: #1DB954;
        }

        .sticky-stat-number {
            font-family: 'Syne', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            line-height: 1;
        }

        .sticky-stat-label {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.5);
        }

        .sticky-cta {
            display: flex;
            gap: 1rem;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .sticky-nav-link {
            color: white;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: opacity 0.3s;
            pointer-events: auto !important;
            position: relative !important;
            z-index: 1;
        }

        .sticky-nav-link:hover { opacity: 0.7; }

        @media (max-width: 768px) {
            /* Sticky header adjustments */
            .sticky-header {
                padding: 0.75rem 1rem !important;
            }

            .sticky-header-content {
                gap: 0.75rem !important;
            }

            /* Hide stats on mobile to save space */
            .sticky-stats {
                display: none !important;
            }

            /* Logo size */
            .sticky-logo img {
                max-height: 32px !important;
            }

            /* Mobile nav - make text smaller.
               Tighter than the homepage copy: with four links the last one
               ("Contact") ran 3px past the viewport edge at 700px. */
            .sticky-cta {
                gap: 0.3rem !important;
                flex-shrink: 1 !important;
            }

            .sticky-nav-link {
                font-size: 0.65rem !important;
                padding: 0.25rem 0.3rem !important;
                white-space: nowrap;
            }

            /* Body padding for smaller header */
            body {
                padding-top: 60px !important;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .sticky-nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Sticky Header — same structure as index.html so the two pages match -->
    <header id="main-header" class="sticky-header" data-sticky-nav="true">
        <div class="sticky-header-content">
            <div class="sticky-logo">
                <a href="index.html"><img src="assets/images/SSK Logo.png" alt="SSK Music"></a>
            </div>
            <div class="sticky-stats">
                <div class="sticky-stat">
                    <i class="ri-youtube-fill sticky-stat-icon youtube"></i>
                    <div>
                        <div class="sticky-stat-number" id="sticky-yt">--</div>
                        <div class="sticky-stat-label">YouTube</div>
                    </div>
                </div>
                <div class="sticky-stat">
                    <i class="ri-spotify-fill sticky-stat-icon spotify"></i>
                    <div>
                        <div class="sticky-stat-number" id="sticky-sp">--</div>
                        <div class="sticky-stat-label">Spotify</div>
                    </div>
                </div>
            </div>
            <div class="sticky-cta">
                <a href="index.html" class="sticky-nav-link bypass-touch-check">Home</a>
                <a href="index.html#services" class="sticky-nav-link bypass-touch-check">Services</a>
                <a href="discography.html" class="sticky-nav-link bypass-touch-check active">Discography</a>
                <a href="contact.html" class="sticky-nav-link bypass-touch-check">Contact</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Discography</h1>
            <p class="hero-subtitle">Complete collection of all releases featuring SSK Music production work</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="discography-page container">
        <!-- Tab Navigation -->
        <div class="discography-tabs">
            <button class="tab-btn active" data-tab="releases">
                <i class="ri-disc-line"></i>
                Releases
            </button>
        </div>

        <!-- Search & Filter -->
        <div class="discography-filters">
            <div class="search-box">
                <div style="display: flex; align-items: center;">
                    <i class="ri-search-line search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search releases or credits...">
                </div>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="track">Tracks</button>
                <button class="filter-btn" data-filter="beat">Beats</button>
            </div>
        </div>

        <!-- Releases Section -->
        <div id="releases-section">
            <div class="section-header">
                <h3>Releases</h3>
                <p class="section-subtitle">Beats and albums produced and released by SSK Music</p>
            </div>
            <div id="releasesLoading" class="loading-state">
                <i class="ri-loader-4-line"></i>
                <p>Loading releases...</p>
            </div>
            <div id="releases-content" class="library"></div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="assets/js/jquery-3.6.0.min.js?v=5d92f54"></script>
    <script src="assets/js/gsap.min.js?v=5d92f54"></script>
    <script src="assets/js/barba.min.js?v=5d92f54"></script>
    <script src="assets/js/barba.js?v=5d92f54"></script>
    <script src="assets/js/main.js?v=5d92f54"></script>
    <script src="assets/js/discography.js?v=5d92f54"></script>

    <!-- Live stats in the shared header, same endpoint as the homepage -->
    <script>
    (function () {
        function fmt(n) { return Number(n).toLocaleString('en-GB'); }
        fetch('/api/stats')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var yt = document.getElementById('sticky-yt');
                var sp = document.getElementById('sticky-sp');
                if (yt && d.youtube) yt.textContent = fmt(d.youtube);
                if (sp && d.spotify) sp.textContent = fmt(d.spotify);
            })
            .catch(function () { /* header still renders with -- */ });
    })();
    </script>
</body>
</html>
